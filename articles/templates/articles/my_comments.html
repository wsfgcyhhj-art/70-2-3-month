<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои комментарии</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        .comment-item { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-radius: 4px; border-left: 3px solid #0066cc; }
        .comment-header { font-size: 0.9em; color: #666; margin-bottom: 5px; }
        .article-link { font-weight: bold; color: #0066cc; text-decoration: none; }
        .article-link:hover { text-decoration: underline; }
        .comment-date { color: #888; margin-left: 10px; }
        .comment-actions { margin-top: 10px; font-size: 0.9em; }
        .comment-actions a { margin-right: 15px; }
        .empty-comments { font-style: italic; color: #888; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <a href="/" class="back-link">&larr; На главную</a>
    <h1>Мои комментарии</h1>

    {% for comment in comments %}
        <div class="comment-item">
            <div class="comment-header">
                Статья: <a href="{% url 'article_detail' comment.article.pk %}" class="article-link">{{ comment.article.title }}</a>
                <span class="comment-date">{{ comment.created_at|date:"d.m.Y H:i" }}</span>
            </div>
            <div class="comment-body">
                {{ comment.text|linebreaks }}
            </div>
            <div class="comment-actions">
                <a href="{% url 'edit_comment' comment.pk %}" style="color: #0066cc;">Редактировать</a>
                <a href="{% url 'delete_comment' comment.pk %}" style="color: #cc0000;">Удалить</a>
            </div>
        </div>
    {% empty %}
        <p class="empty-comments">У вас пока нет комментариев.</p>
    {% endfor %}
</body>
</html>
